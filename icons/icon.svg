<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mi compra">
  <!-- Icono normal: fondo verde con esquinas redondeadas -->
  <rect width="512" height="512" rx="112" fill="#1f6f43"/>

  <g transform="translate(256 256) scale(1.1) translate(-256 -256)">
    <!-- Asa de la cesta -->
    <path d="M 176 200 C 176 112 336 112 336 200"
          fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>

    <!-- Cuerpo de la cesta -->
    <path d="M 120 200 L 392 200 L 368 376 A 20 20 0 0 1 348 396 L 164 396 A 20 20 0 0 1 144 376 Z"
          fill="#ffffff"/>

    <!-- Huecos verticales que sugieren el trenzado -->
    <rect x="191" y="226" width="18" height="138" rx="9" fill="#1f6f43"/>
    <rect x="247" y="226" width="18" height="138" rx="9" fill="#1f6f43"/>
    <rect x="303" y="226" width="18" height="138" rx="9" fill="#1f6f43"/>
  </g>
</svg>
